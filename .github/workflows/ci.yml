name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (FastAPI + OR-Tools)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        working-directory: backend
        # The suite uses in-memory SQLite; no Postgres/Redis service needed.
        env:
          RATE_LIMIT_PER_MINUTE: "0"
        run: pytest tests/ -q

      - name: Check migrations run from an empty database
        working-directory: backend
        run: |
          DATABASE_URL="sqlite:////tmp/ci-migrate.db" alembic upgrade head
          DATABASE_URL="sqlite:////tmp/ci-migrate.db" alembic downgrade base
          DATABASE_URL="sqlite:////tmp/ci-migrate.db" alembic upgrade head

  frontend:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx tsc --noEmit && npm run build
